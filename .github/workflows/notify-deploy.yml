name: Notify deployment result

on:
  workflow_run:
    workflows:
      - "Build and deploy .NET Core application to Web App filevoyage"
      - "Build and deploy ASP.Net Core app to Azure Web App - filevoyage"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required')
    runs-on: [self-hosted, Linux, X64, acer-linux]
    timeout-minutes: 5
    steps:
      - name: Send one final publication result
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 /mnt/d/BuildFarm/scripts/Notify-Deployment.py
